name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai_review_job:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      models: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR diff
        id: diff
        run: |
          git diff --unified=80 origin/${{ github.base_ref }}...HEAD \
            -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)packages/**/package-lock.json' \
            > diff.txt

          if [ -s diff.txt ]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Indent diff for YAML
        if: steps.diff.outputs.has_diff == 'true'
        run: |
          sed 's/^/        /' diff.txt > diff-indented.txt

      - name: Review with GitHub Models
        if: steps.diff.outputs.has_diff == 'true'
        id: ai_review
        uses: actions/ai-inference@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prompt-file: ./.github/prompts/pr-review.prompt.yml
          file_input: |
            diff: ./diff-indented.txt

      - name: Comment on PR
        if: steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file "${{ steps.ai_review.outputs.response-file }}"