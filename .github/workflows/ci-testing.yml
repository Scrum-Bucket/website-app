name: CI Testing

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: rm -rf node_modules package-lock.json
      - run: npm install --include=optional
      - run: npm ci --include=optional
      - run: npm run -w packages/express-backend lint
      - run: npm run -w packages/react-frontend lint
      - run: npm run -w packages/react-frontend build