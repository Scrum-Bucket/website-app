<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="none"/>

  <!-- larger claws -->
  <rect x="0" y="3" width="3" height="2" fill="#ff6b6b"/>
  <rect x="0" y="1" width="2" height="2" fill="#ff6b6b"/>
  <rect x="2" y="5" width="1" height="1" fill="#ff6b6b"/>

  <rect x="13" y="3" width="3" height="2" fill="#ff6b6b"/>
  <rect x="14" y="1" width="2" height="2" fill="#ff6b6b"/>
  <rect x="13" y="5" width="1" height="1" fill="#ff6b6b"/>

  <!-- arms -->
  <rect x="3" y="5" width="1" height="1" fill="#e05252"/>
  <rect x="12" y="5" width="1" height="1" fill="#e05252"/>

  <!-- legs -->
  <rect x="2" y="9" width="1" height="2" fill="#e05252"/>
  <rect x="4" y="10" width="1" height="2" fill="#e05252"/>
  <rect x="11" y="10" width="1" height="2" fill="#e05252"/>
  <rect x="13" y="9" width="1" height="2" fill="#e05252"/>

  <!-- body -->
  <rect x="3" y="4" width="10" height="7" fill="#ff6b6b"/>
  <rect x="4" y="3" width="8" height="1" fill="#ff8a8a"/>

  <!-- eyes -->
  <rect x="5" y="2" width="1" height="2" fill="#2d2d2d"/>
  <rect x="10" y="2" width="1" height="2" fill="#2d2d2d"/>
  <rect x="5" y="2" width="1" height="1" fill="#ffffff"/>
  <rect x="10" y="2" width="1" height="1" fill="#ffffff"/>

  <!-- smile -->
  <rect x="6" y="8" width="1" height="1" fill="#2d2d2d"/>
  <rect x="9" y="8" width="1" height="1" fill="#2d2d2d"/>
  <rect x="7" y="9" width="2" height="1" fill="#2d2d2d"/>
</svg>